plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // Тестовые библиотеки тянем только с Maven Central: maven.neoforged.net
    // отсюда недоступен и иначе Gradle ждёт таймаут на каждый артефакт.
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroupByRegex 'org\\.junit.*'
            includeGroupByRegex 'org\\.opentest4j.*'
            includeGroupByRegex 'org\\.apiguardian.*'
        }
    }
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Пробрасываем stdin в игру, чтобы можно было отдавать команды серверу из консоли:
// mkfifo /tmp/opencode/server.in && ./gradlew runServer < /tmp/opencode/server.in
tasks.matching { it.name == 'runServer' || it.name == 'runClient' || it.name == 'runData' }.configureEach {
    standardInput = System.in
    if (project.hasProperty('clientArgs')) {
        args project.property('clientArgs').toString().split(' ')
    }
    if (project.hasProperty('uitest')) {
        systemProperty 'libresearch.uitest', 'true'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: '[1.21.1,1.22)',
            neo_version            : neo_version,
            neo_version_range      : '[21.1.0,22)',
            loader_version_range   : '[4,)',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}
